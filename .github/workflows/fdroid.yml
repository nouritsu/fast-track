# Builds the F-Droid repo from the newest releases and uploads it to fdroid.nouritsu.com.
# The release workflow calls it once a release is out: a release made with GITHUB_TOKEN
# starts no workflows, so a `release` trigger would never fire. It also runs by hand.
name: F-Droid

on:
  workflow_call:
    inputs:
      version:
        description: The version just released; the run fails if the repo would lack it
        type: string
        required: false
    secrets:
      FDROID_KEYSTORE_BASE64:
        required: true
      FDROID_KEYSTORE_PASSWORD:
        required: true
      FDROID_KEY_ALIAS:
        required: true
      FDROID_KEY_PASSWORD:
        required: true
      FDROID_SSH_KEY:
        required: true
      FDROID_SSH_KNOWN_HOSTS:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One upload at a time; a second run waits instead of cutting one off mid-rsync.
    concurrency:
      group: fdroid-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before the Nix steps, so a missing secret fails in seconds. Nothing is written to
      # disk here; the keys are written right before they are used.
      - name: Check the F-Droid secrets
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
          FDROID_SSH_KEY: ${{ secrets.FDROID_SSH_KEY }}
          FDROID_SSH_KNOWN_HOSTS: ${{ secrets.FDROID_SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          for name in FDROID_KEYSTORE_BASE64 FDROID_KEYSTORE_PASSWORD FDROID_KEY_ALIAS FDROID_KEY_PASSWORD FDROID_SSH_KEY FDROID_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=F-Droid secrets missing::Add these repository secrets: ${missing[*]}"
            exit 1
          fi
          if ! printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 -d > /dev/null; then
            echo "::error title=Bad keystore secret::FDROID_KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi
          if [[ "$FDROID_SSH_KEY" != "-----BEGIN OPENSSH PRIVATE KEY-----"* ]]; then
            echo "::error title=Bad SSH key secret::FDROID_SSH_KEY is not an OpenSSH private key, as ssh-keygen -t ed25519 writes it"
            exit 1
          fi
          # The host key is pinned here, never fetched with ssh-keyscan at run time.
          if ! printf '%s\n' "$FDROID_SSH_KNOWN_HOSTS" | ssh-keygen -F nouritsu.com -f /dev/stdin > /dev/null; then
            echo "::error title=Bad known_hosts secret::FDROID_SSH_KNOWN_HOSTS has no line for nouritsu.com"
            exit 1
          fi

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # Restore only, like release.yml: ci.yml saves the cache on main.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**', 'app/package-lock.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      # The repo is rebuilt from the releases each time. fdroid/config.yml's archive_older
      # versions stay in repo/, and as many again go to archive/.
      - name: Download the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          keep=$(yq '.archive_older' fdroid/config.yml)
          if ! [[ "$keep" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Bad archive_older::fdroid/config.yml's archive_older should be a positive number, not $keep"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apks"
          gh release list --exclude-drafts --exclude-pre-releases --limit "$((keep * 2))" \
            --json tagName,publishedAt --jq '.[] | [.tagName, .publishedAt] | @tsv' > "$RUNNER_TEMP/releases.tsv"
          while IFS=$'\t' read -r tag published; do
            dir="$RUNNER_TEMP/releases/$tag"
            gh release download "$tag" --dir "$dir" --pattern 'fast-track-*.apk' --pattern SHA256SUMS
            (cd "$dir" && sha256sum -c SHA256SUMS)
            # fdroid-repo dates each version by its file's mtime: here, its release's.
            touch -d "$published" "$dir"/*.apk
            mv "$dir"/*.apk "$RUNNER_TEMP/apks/"
          done < "$RUNNER_TEMP/releases.tsv"
          if [ -n "$VERSION" ] && [ ! -f "$RUNNER_TEMP/apks/fast-track-$VERSION.apk" ]; then
            echo "::error title=Release missing::fast-track-$VERSION.apk is not among the newest releases"
            exit 1
          fi

      # The keystore is on disk only from here to the removal step below.
      - name: Write the repo keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fdroid.keystore"

      # The passwords stay in the environment: config.yml reads them with {env: NAME}.
      - name: Build the repo
        env:
          FAST_TRACK_REPO_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FAST_TRACK_REPO_KEY_PASS: ${{ secrets.FDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: nix run -L .#fdroid-repo -- --apks "$RUNNER_TEMP/apks" --keystore "$RUNNER_TEMP/fdroid.keystore" --alias "$KEY_ALIAS"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/fdroid.keystore"

      - name: Write the deploy key
        env:
          FDROID_SSH_KEY: ${{ secrets.FDROID_SSH_KEY }}
          FDROID_SSH_KNOWN_HOSTS: ${{ secrets.FDROID_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$FDROID_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$FDROID_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          if ! ssh-keygen -y -P '' -f "$RUNNER_TEMP/ssh/key" > /dev/null; then
            echo "::error title=Bad SSH key secret::FDROID_SSH_KEY can't be read; it must have no passphrase"
            exit 1
          fi

      # The server's forced command (rrsync) confines the upload to /srv/fdroid, so the
      # path here is relative to it. --delay-updates swaps the new files in at the end,
      # so clients never read an index whose APKs are still on their way.
      - name: Upload the site
        run: |
          ssh="ssh -i $RUNNER_TEMP/ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          rsync -rlt --delete --delay-updates -e "$ssh" out/fdroid/ fdroid-deployer@nouritsu.com:

      - name: Remove the deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
