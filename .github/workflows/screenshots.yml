# Renders the store screenshots and opens a pull request when they change. The release
# workflow calls it once a release is out; it also runs by hand.
name: Screenshots

on:
  workflow_call:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A calling workflow must grant these too.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      # Restore only: called from a release, this runs on its tag, and a cache saved there
      # serves that tag alone. ci.yml saves the cache on main.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**', 'app/package-lock.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false
      - run: nix run .#screenshots
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # A release checks out its tag, not a branch.
          base: main
          branch: update-screenshots
          delete-branch: true
          add-paths: fastlane/metadata/android/en-US/images/phoneScreenshots
          commit-message: Update the screenshots
          title: Update the screenshots
          body: Rendered by `nix run .#screenshots`.
