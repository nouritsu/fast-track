<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e2e" />
    <script>
      // The theme before the first paint: the saved choice, else Mocha (src/lib/theme.ts).
      {
        let saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch {}
        const theme = saved === 'latte' ? 'latte' : 'mocha'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'mocha' ? '#1e1e2e' : '#eff1f5'
      }
    </script>
    <title>Fast Track</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
